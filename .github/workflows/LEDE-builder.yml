# .github/workflows/sync-netcore-n60-pro-root.yml
name: Sync netcore-n60-pro (OVERWRITE ROOT)

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

      - name: Remove all files except .git
        run: |
          find . -maxdepth 1 ! -name .git ! -name . -exec rm -rf {} \;

      - name: Clone source to root
        run: |
          git clone --depth 1 https://github.com/moshanghuakai01/netcore-n60-pro.git tmp
          cp -r tmp/. .
          rm -rf tmp

      - name: Commit and force push
        run: |
          git add .
          git commit -m "chore: overwrite root with netcore-n60-pro source" || echo "No changes"
          git push --force origin main
