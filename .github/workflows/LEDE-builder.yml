# .github/workflows/sync-netcore-n60-pro.yml
name: Sync netcore-n60-pro source (overwrite root)

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git with token
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 将 token 嵌入 remote URL，解决认证问题
          git remote set-url origin https://oauth2:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

      - name: Force reset to origin/main (discard local changes)
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Remove all files except .git
        run: |
          find . -maxdepth 1 ! -name .git ! -name . -exec rm -rf {} \;

      - name: Clone source to root
        run: |
          git clone --depth 1 https://github.com/moshanghuakai01/netcore-n60-pro.git tmp
          cp -r tmp/. .
          rm -rf tmp

      - name: Commit and force push
        run: |
          git add .
          git commit -m "chore: sync netcore-n60-pro source (overwrite)" || echo "No changes to commit"
          git push --force origin main
