# .github/workflows/sync-netcore-n60-pro.yml
name: Sync netcore-n60-pro source

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

      - name: Remove old netcore-n60-pro directory
        run: rm -rf netcore-n60-pro

      - name: Clone source from upstream
        run: |
          git clone --depth 1 https://github.com/moshanghuakai01/netcore-n60-pro.git netcore-n60-pro

      - name: Remove .git from cloned source
        run: rm -rf netcore-n60-pro/.git

      - name: Add, commit and push
        run: |
          git add netcore-n60-pro
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: sync netcore-n60-pro source"
            git push origin main
          fi
