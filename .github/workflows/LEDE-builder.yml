# .github/workflows/sync-netcore-n60-pro.yml
name: Sync netcore-n60-pro source

on:
  workflow_dispatch:        # 手动触发
  schedule:
    - cron: '0 0 * * 0'     # 每周日零点自动同步（可选）

env:
  SOURCE_REPO: https://github.com/moshanghuakai01/netcore-n60-pro.git
  SOURCE_BRANCH: main       # 若上游默认分支是 master，请修改
  TARGET_BRANCH: main       # 你的目标分支

jobs:
  sync:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Remove existing netcore-n60-pro directory (if any)
        run: rm -rf netcore-n60-pro

      - name: Clone source repository
        run: |
          git clone --depth 1 --branch ${{ env.SOURCE_BRANCH }} ${{ env.SOURCE_REPO }} netcore-n60-pro

      - name: Remove .git from cloned source
        run: rm -rf netcore-n60-pro/.git

      - name: Commit and push to your ${{ env.TARGET_BRANCH }} branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add netcore-n60-pro
          git commit -m "chore: sync netcore-n60-pro source from upstream" || echo "No changes to commit"
          git push origin ${{ env.TARGET_BRANCH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
