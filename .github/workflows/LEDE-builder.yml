name: Sync netcore-n60-pro (DANGEROUS - overwrites root)

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove all files except .git
        run: |
          find . -maxdepth 1 ! -name .git ! -name . -exec rm -rf {} \;

      - name: Clone source to root
        run: |
          git clone --depth 1 https://github.com/moshanghuakai01/netcore-n60-pro.git tmp
          cp -r tmp/. .
          rm -rf tmp

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: sync netcore-n60-pro source (overwrite root)" || echo "No changes"
          git push origin main
